name: Validate jaxprop candidate
on:
  workflow_dispatch:
    inputs:
      jaxprop_ref:
        description: "jaxprop Git ref to build and validate before PyPI release"
        required: true
        default: main
jobs:
  downstream:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: turbo-sim/jaxprop
          ref: ${{ inputs.jaxprop_ref }}
          path: candidate-jaxprop
      - name: Record candidate revision
        shell: bash
        run: echo "JAXPROP_SOURCE_REVISION=$(git -C candidate-jaxprop rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build candidate wheel
        run: python -m pip wheel ./candidate-jaxprop --no-deps --wheel-dir candidate-wheel
      - name: Install candidate and downstream package
        shell: bash
        run: python -m pip install ./candidate-wheel/*.whl . pytest
      - name: Verify imported candidate and run numerical suite
        run: |
          python -c "import jaxprop; print(jaxprop.__version__, jaxprop.__file__)"
          python -m pytest -q
      - name: Run demo smoke tests
        run: python -m pytest -m examples -q
      - name: Record representative timings
        run: python benchmarks/run_benchmarks.py --repeat 3 --output benchmarks/results/candidate.json
      - name: Build visual timing report
        run: python benchmarks/render_report.py --run "Candidate=benchmarks/results/candidate.json" --output benchmarks/results/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmarks/results/candidate.json
            benchmarks/results/report.html
